<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F7FD">
<title>Zorion CRM</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0E1E30; --ink-2:#33445C; --muted:#64738A; --faint:#9BA7B9;
  --blue:#3A86FF; --blue-2:#2F6FE0; --blue-ink:#1F5FD1; --blue-soft:#EAF2FF; --blue-glow:rgba(58,134,255,.35);
  --bg:#F3F7FD; --card:#FFFFFF;
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.75);
  --line:rgba(14,30,48,.08); --line-2:rgba(14,30,48,.13);
  --amber:#B57A00; --amber-soft:#FFF4D1; --red:#D13A3F; --red-soft:#FDECEC; --green:#12865A; --green-soft:#E2F6EC;
  --display:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --body:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.32,.72,0,1);
  --shadow-1:0 1px 2px rgba(14,30,48,.05),0 10px 24px -16px rgba(14,30,48,.28);
  --shadow-2:0 2px 6px rgba(14,30,48,.06),0 24px 50px -24px rgba(14,30,48,.38);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{display:block}

/* ---------- ambient background ---------- */
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.amb i:nth-child(1){width:46vw;height:46vw;left:58%;top:-18%;background:#BCD6FF;animation:drift1 28s var(--ease) infinite alternate}
.amb i:nth-child(2){width:38vw;height:38vw;left:-10%;top:55%;background:#D3E4FF;animation:drift2 34s var(--ease) infinite alternate}
.amb i:nth-child(3){width:26vw;height:26vw;left:35%;top:30%;background:#E6F0FF;animation:drift1 40s var(--ease) infinite alternate-reverse}
@keyframes drift1{to{transform:translate(-8vw,6vh) scale(1.08)}}
@keyframes drift2{to{transform:translate(7vw,-8vh) scale(.94)}}

/* ---------- the reveal: top-left to bottom-right, soft ---------- */
.rv{
  animation:rv .72s var(--ease) both; animation-delay:calc(var(--i,0) * 38ms);
  -webkit-mask-image:linear-gradient(135deg,#000 42%,transparent 58%);mask-image:linear-gradient(135deg,#000 42%,transparent 58%);
  -webkit-mask-size:300% 300%;mask-size:300% 300%;
}
@keyframes rv{
  from{opacity:0;transform:translateY(10px) scale(.985);filter:blur(5px);-webkit-mask-position:100% 100%;mask-position:100% 100%}
  to{opacity:1;transform:none;filter:blur(0);-webkit-mask-position:0 0;mask-position:0 0}
}
.fade{animation:fade .4s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{
  margin:14px 0 14px 14px;border-radius:26px;padding:22px 14px 16px;display:flex;flex-direction:column;gap:26px;
  background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--glass-line);box-shadow:var(--shadow-1),inset 0 1px 0 rgba(255,255,255,.9);
}
.logo{padding:2px 10px 0}
.logo img{width:136px;height:auto}
.nav{position:relative;display:flex;flex-direction:column;gap:4px}
.nav .pill{position:absolute;left:0;right:0;top:0;height:44px;border-radius:14px;background:linear-gradient(180deg,#4B92FF,#2F78F2);
  box-shadow:0 10px 22px -10px var(--blue-glow),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .5s var(--spring),opacity .3s;z-index:0}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:14px;font-weight:500;color:var(--ink-2);text-align:left;transition:color .3s var(--ease)}
.nav button:not(.on):not(.soon):hover{background:rgba(14,30,48,.04)}
.nav button.on{color:#fff}
.nav svg{width:20px;height:20px;flex:none}
.nav .count{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--amber-soft);color:var(--amber);transition:background .3s,color .3s}
.nav button.on .count{background:rgba(255,255,255,.24);color:#fff}
.nav .soon{opacity:.42;cursor:default}
.nav .soon small{margin-left:auto;font-size:11px;font-weight:500}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.clock{display:flex;align-items:baseline;gap:6px}
.clock b{font:700 22px/1 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock span{font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.sync.busy .dot{background:var(--blue);animation:pulse 1s ease-in-out infinite}
.sync.err .dot{background:var(--red);box-shadow:0 0 0 3px rgba(209,58,63,.15)}
.sync button{margin-left:auto;color:var(--blue-ink);font-weight:600}

main{min-width:0;height:100%;display:flex;flex-direction:column;padding:26px 28px 18px 30px;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font:800 32px/1 var(--display);letter-spacing:-.025em}
.top .date{color:var(--muted);font-weight:500;padding-top:6px}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600;
  background:var(--glass-hi);border:1px solid var(--glass-line);box-shadow:var(--shadow-1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip.sab{color:var(--blue-ink)}
.chip.warn{color:var(--amber)}
.chip .ld{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
#chips{display:flex;gap:8px}
.search{position:relative;width:250px}
.search input{width:100%;height:38px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass-hi);padding:0 34px 0 36px;outline:none;
  box-shadow:var(--shadow-1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:box-shadow .3s var(--ease),border-color .3s}
.search input:focus{border-color:rgba(58,134,255,.5);box-shadow:0 0 0 4px rgba(58,134,255,.12)}
.search svg{position:absolute;left:12px;top:11px;width:16px;height:16px;color:var(--faint)}
.search kbd{position:absolute;right:10px;top:10px;font:600 11px/18px var(--body);color:var(--faint);border:1px solid var(--line-2);border-radius:6px;padding:0 6px}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- pipeline ---------- */
.board{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 6px}
.col{display:flex;flex-direction:column;min-height:0;border-radius:24px;padding:10px;
  background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .25s var(--ease),border-color .25s,box-shadow .25s}
.col.over{background:rgba(234,242,255,.75);border-color:rgba(58,134,255,.45);box-shadow:0 0 0 4px rgba(58,134,255,.10)}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-weight:600}
.col-h .sd{width:8px;height:8px;border-radius:50%}
.col-h .n{font-size:12px;font-weight:600;color:var(--muted);background:rgba(14,30,48,.06);border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums}
.col-body{flex:1;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px;scrollbar-width:thin}
.empty-col{flex:1;min-height:90px;border:1.5px dashed var(--line-2);border-radius:16px;display:grid;place-items:center;color:var(--faint);font-size:13px}
.sd.new{background:var(--ink)} .sd.calling{background:#F2A900} .sd.talked{background:var(--blue)} .sd.booked{background:#22B573} .sd.done{background:var(--faint)}

.card{position:relative;display:flex;flex-direction:column;gap:9px;width:100%;text-align:left;padding:13px 14px 12px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-1);cursor:pointer;
  transition:transform .35s var(--spring),box-shadow .35s var(--ease),border-color .25s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:rgba(58,134,255,.25)}
.card:active{transform:scale(.985)}
.card.dragging{opacity:.4;transform:scale(.97)}
.card .r1{display:flex;align-items:baseline;gap:8px}
.card .nm{font-weight:600;font-size:15px;letter-spacing:-.005em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .age{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.card .ad{font-size:12px;color:var(--muted);margin-top:-6px}
.card.flash{animation:flash 1.1s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(58,134,255,.5),var(--shadow-1)}100%{box-shadow:0 0 0 14px rgba(58,134,255,0),var(--shadow-1)}}
.dots{display:flex;align-items:center;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(14,30,48,.11);transition:background .4s var(--ease),transform .4s var(--spring)}
.dots i.on{background:var(--blue)}
.dots span{margin-left:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nx{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.nx svg{width:14px;height:14px;flex:none}
.nx.due{color:var(--amber);font-weight:600}
.nx.over{color:var(--red);font-weight:600}
.nx.booked{color:var(--green);font-weight:600}
.nx .live{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.tag{align-self:flex-start;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}
.tag.won,.pill.won{background:var(--green-soft);color:var(--green)}
.tag.lost,.pill.lost{background:var(--red-soft);color:var(--red)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;white-space:nowrap}
.pill.new{background:rgba(14,30,48,.07);color:var(--ink)}
.pill.calling{background:var(--amber-soft);color:var(--amber)}
.pill.talked{background:var(--blue-soft);color:var(--blue-ink)}
.pill.booked{background:var(--green-soft);color:var(--green)}

/* ---------- lists (today, leads) ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 4px 24px 2px}
.today{max-width:760px;display:flex;flex-direction:column;gap:22px}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;color:var(--ink-2);
  background:linear-gradient(120deg,rgba(234,242,255,.9),rgba(255,255,255,.7));border:1px solid var(--glass-line);box-shadow:var(--shadow-1)}
.banner svg{width:22px;height:22px;color:var(--blue);flex:none}
.grp h2{margin:0 0 8px 6px;font:700 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.grp.over h2{color:var(--red)}
.list{border-radius:20px;background:var(--glass-hi);border:1px solid var(--glass-line);box-shadow:var(--shadow-1);overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) auto auto;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;border-top:1px solid var(--line);transition:background .2s}
.row:first-child{border-top:0}
.row:hover{background:rgba(255,255,255,.75)}
.row .t{font:700 15px/1 var(--body);font-variant-numeric:tabular-nums}
.row .t small{display:block;margin-top:4px;font-size:11px;font-weight:500;color:var(--muted)}
.row .who b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who small{color:var(--muted);font-size:13px}
.callbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 8px 16px -8px var(--blue-glow);transition:transform .3s var(--spring)}
.callbtn:hover{transform:scale(1.08)}
.callbtn svg{width:17px;height:17px}
.nothing{padding:28px 18px;text-align:center;color:var(--muted)}
.nothing b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.leads{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start;max-width:1040px}
.cal{border-radius:24px;padding:18px;background:var(--glass-hi);border:1px solid var(--glass-line);box-shadow:var(--shadow-1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.cal-h{display:flex;align-items:center;margin-bottom:12px}
.cal-h b{font:700 17px/1 var(--display);flex:1}
.cal-h button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:background .2s}
.cal-h button:hover{background:rgba(14,30,48,.06)}
.cal-h svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.grid .wd{font-size:11px;font-weight:600;color:var(--faint);padding:4px 0 6px}
.grid button{position:relative;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-weight:500;font-variant-numeric:tabular-nums;transition:background .25s var(--ease),color .25s,transform .3s var(--spring)}
.grid button:hover:not(:disabled){background:rgba(58,134,255,.08)}
.grid button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue)}
.grid button.today{color:var(--blue-ink);font-weight:700}
.grid button.sel{background:var(--blue);color:#fff;transform:scale(1.04);box-shadow:0 8px 16px -8px var(--blue-glow)}
.grid button.sel::after{background:#fff}
.grid button:disabled{color:var(--faint);opacity:.5;cursor:default}
.day-h{display:flex;align-items:baseline;gap:10px;margin:4px 0 12px 6px}
.day-h b{font:700 20px/1 var(--display)}
.day-h span{color:var(--muted)}

/* ---------- lead sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:32px;background:rgba(14,30,48,.18);
  backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);animation:fade .35s var(--ease) both}
.scrim.out{animation:fadeout .24s var(--ease) both}
@keyframes fadeout{to{opacity:0}}
.sheet{position:relative;width:100%;max-width:500px;max-height:100%;overflow-y:auto;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:16px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);
  border:1px solid rgba(255,255,255,.85);box-shadow:0 40px 100px -30px rgba(14,30,48,.5),inset 0 1px 0 #fff;
  animation:sheetin .6s var(--spring) both;scrollbar-width:thin}
.scrim.out .sheet{animation:sheetout .24s var(--ease) both}
@keyframes sheetin{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
@keyframes sheetout{to{opacity:0;transform:translateY(10px) scale(.97)}}
.sheet > *{animation:rv .6s var(--ease) both;animation-delay:calc(80ms + var(--i,0) * 45ms);
  -webkit-mask-image:linear-gradient(135deg,#000 42%,transparent 58%);mask-image:linear-gradient(135deg,#000 42%,transparent 58%);-webkit-mask-size:300% 300%;mask-size:300% 300%}
.sheet > *{flex-shrink:0}
.sheet.settled > *{animation:none;-webkit-mask-image:none;mask-image:none}
.sheet > .picker,.sheet.settled > .picker{animation:open .45s var(--spring) both}
.sh-top{display:flex;align-items:center;gap:14px}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px;
  background:linear-gradient(140deg,#6AA6FF,#2F6FE0);box-shadow:0 10px 20px -10px var(--blue-glow)}
.sh-top .who{flex:1;min-width:0}
.sh-top .who b{display:block;font:800 22px/1.1 var(--display);letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-top .who .pill{margin-top:5px}
.x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(14,30,48,.06);flex:none;transition:background .2s,transform .3s var(--spring)}
.x:hover{background:rgba(14,30,48,.1);transform:rotate(90deg)}
.x svg{width:16px;height:16px}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.contact a,.contact button.cp{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;transition:border-color .2s,transform .3s var(--spring)}
.contact a:hover,.contact button.cp:hover{border-color:rgba(58,134,255,.4);transform:translateY(-1px)}
.contact a.tel{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 8px 16px -8px var(--blue-glow);font-variant-numeric:tabular-nums}
.contact svg{width:15px;height:15px}
.meta{font-size:13px;color:var(--muted);margin-top:-6px}
.nextbox{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--blue-soft)}
.nextbox.over{background:var(--red-soft)} .nextbox.booked{background:var(--green-soft)} .nextbox.fin{background:rgba(14,30,48,.05)}
.nextbox .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink)}
.nextbox.over .l{color:var(--red)} .nextbox.booked .l{color:var(--green)} .nextbox.fin .l{color:var(--muted)}
.nextbox .v{font:700 18px/1.2 var(--body);margin-top:3px}
.nextbox .s{font-size:12px;color:var(--muted);margin-top:2px}
.nextbox .dots{margin-left:auto}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts.two{grid-template-columns:repeat(2,1fr)}
.acts button{height:44px;border-radius:14px;font-weight:600;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(14,30,48,.04);
  transition:transform .3s var(--spring),border-color .2s,background .2s,box-shadow .3s}
.acts button:hover{border-color:rgba(58,134,255,.35);transform:translateY(-1px)}
.acts button:active{transform:scale(.97)}
.acts .pri{background:linear-gradient(180deg,#4B92FF,#2F78F2);color:#fff;border-color:transparent;box-shadow:0 10px 20px -10px var(--blue-glow)}
.acts .won{color:var(--green)} .acts .lost{color:var(--red)}
.acts button.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,134,255,.15)}
.picker{border-radius:18px;padding:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;overflow:hidden;animation:open .45s var(--spring) both}
@keyframes open{from{opacity:0;transform:translateY(-6px);max-height:0;padding-block:0}to{opacity:1;transform:none;max-height:640px}}
.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 4px 8px;margin:-4px -4px 0;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:start;width:56px;height:64px;border-radius:16px;background:rgba(14,30,48,.045);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:background .25s var(--ease),color .25s,transform .35s var(--spring),box-shadow .3s}
.day:hover:not(:disabled):not(.sel){background:var(--blue-soft)}
.day small{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.day b{font:700 20px/1 var(--display)}
.day.sel{background:linear-gradient(180deg,#4B92FF,#2F78F2);color:#fff;transform:scale(1.05);box-shadow:0 10px 18px -10px var(--blue-glow)}
.day.sel small{color:rgba(255,255,255,.85)}
.day:disabled{opacity:.32;cursor:default}
.tg{display:flex;flex-direction:column;gap:6px}
.tg > span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.times button{height:38px;border-radius:12px;background:rgba(14,30,48,.045);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;transition:background .2s,color .2s,transform .3s var(--spring)}
.times button:hover:not(.sel){background:var(--blue-soft);color:var(--blue-ink)}
.times button.sel{background:var(--blue);color:#fff;animation:pop .4s var(--spring)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.pk-save{height:48px;border-radius:14px;background:linear-gradient(180deg,#4B92FF,#2F78F2);color:#fff;font-weight:600;box-shadow:0 12px 22px -12px var(--blue-glow);transition:transform .3s var(--spring),opacity .2s}
.pk-save:active{transform:scale(.98)}
.pk-save:disabled{opacity:.4}
.picker .h{font-weight:600}
.picker .h small{font-weight:500;color:var(--muted)}
.undo{align-self:flex-start;font-size:13px;font-weight:600;color:var(--blue-ink);display:inline-flex;gap:6px;align-items:center;margin-top:-6px}
.undo svg{width:14px;height:14px}
.sec h3{margin:0 0 8px;font:700 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.qa{border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.qa div{display:flex;justify-content:space-between;gap:16px;padding:11px 14px;border-top:1px solid var(--line)}
.qa div:first-child{border-top:0}
.qa span{color:var(--muted)} .qa b{font-weight:600;text-align:right}
.log{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.log li{position:relative;display:flex;gap:12px;align-items:center;padding:6px 0 6px 18px;font-size:13px}
.log li::before{content:"";position:absolute;left:3px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--faint)}
.log li::after{content:"";position:absolute;left:6.5px;top:calc(50% + 6px);bottom:-50%;width:1px;background:var(--line-2)}
.log li:last-child::after{display:none}
.log li.talked::before{background:var(--blue)} .log li.booked::before,.log li.won::before{background:#22B573} .log li.lost::before{background:var(--red)} .log li.no_answer::before{background:#F2A900}
.log time{color:var(--muted);min-width:130px;font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-size:13px}
.notes{position:relative}
.notes textarea{width:100%;min-height:76px;resize:vertical;border-radius:14px;border:1px solid var(--line-2);background:#fff;padding:11px 13px;outline:none;line-height:1.45}
.notes textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,134,255,.12)}
.notes .saved{position:absolute;right:4px;top:-20px;font-size:12px;color:var(--green);opacity:0;transition:opacity .3s}
.notes .saved.on{opacity:1}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;z-index:80;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:18px;color:#fff;
  background:rgba(14,30,48,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 40px -16px rgba(14,30,48,.5);
  transform:translate(-50%,140%);opacity:0;transition:transform .5s var(--spring),opacity .3s}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast button{color:#8DB8FF;font-weight:700}

/* ---------- key gate ---------- */
.gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px}
.gate form{width:100%;max-width:380px;border-radius:28px;padding:30px 26px;display:flex;flex-direction:column;gap:14px;text-align:center;
  background:var(--glass-hi);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--shadow-2)}
.gate img{width:150px;margin:0 auto 6px}
.gate p{margin:0;color:var(--muted)}
.gate input{height:46px;border-radius:14px;border:1px solid var(--line-2);padding:0 14px;background:#fff;outline:none;text-align:center;font-size:15px}
.gate input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(58,134,255,.12)}
.gate button{height:46px;border-radius:14px;background:linear-gradient(180deg,#4B92FF,#2F78F2);color:#fff;font-weight:600;box-shadow:0 12px 24px -12px var(--blue-glow)}
.gate .err{color:var(--red);font-size:13px;min-height:18px}
.shake{animation:shake .45s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.skel{border-radius:16px;height:96px;background:linear-gradient(100deg,rgba(255,255,255,.5) 30%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.5) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

/* ---------- phone: one thing at a time, big targets ---------- */
.tabbar,.mcall,.stabs{display:none}
@media (max-width:860px){
  body{overflow:auto;font-size:15px}
  .amb i{filter:blur(50px)}
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  .side{display:none}
  main{height:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .top{gap:8px;margin-bottom:14px}
  .top h1{font-size:30px}
  .top .grow,.search,.chip.warn{display:none}
  #chips{width:100%}
  .view{display:block}
  .board{display:block;overflow:visible}
  .stabs{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * max(16px,env(safe-area-inset-left))) 14px;padding:2px max(16px,env(safe-area-inset-left)) 4px;scrollbar-width:none}
  .stabs::-webkit-scrollbar{display:none}
  .stabs button{flex:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:99px;font-weight:600;
    background:var(--glass-hi);border:1px solid var(--glass-line);box-shadow:var(--shadow-1);transition:background .3s var(--ease),color .3s,transform .35s var(--spring)}
  .stabs button .n{font-size:12px;color:var(--muted);background:rgba(14,30,48,.06);border-radius:99px;padding:1px 8px}
  .stabs button.on{background:linear-gradient(180deg,#4B92FF,#2F78F2);color:#fff;border-color:transparent;box-shadow:0 10px 20px -10px var(--blue-glow)}
  .stabs button.on .n{background:rgba(255,255,255,.25);color:#fff}
  .stabs .sd{width:8px;height:8px;border-radius:50%}
  .stabs button.on .sd{background:#fff}
  .mlist{display:flex;flex-direction:column;gap:10px}
  .card{padding:16px 66px 15px 16px;border-radius:20px;gap:8px}
  .card:hover{transform:none}
  .card .nm{font-size:17px}
  .card .age{position:absolute;right:16px;top:12px}
  .mcall{display:grid;position:absolute;right:14px;top:50%;margin-top:-6px;width:44px;height:44px}
  .mcall svg{width:20px;height:20px}
  .scroll{overflow:visible;padding:0}
  .today{gap:18px}
  .row{grid-template-columns:70px minmax(0,1fr) 44px;padding:16px 14px;gap:12px}
  .row .pill{display:none}
  .row .callbtn{width:44px;height:44px}
  .row .who b{font-size:16px}
  .leads{grid-template-columns:1fr;gap:16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-around;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:var(--glass-hi);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--line)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0;transition:color .3s}
  .tabbar button.on{color:var(--blue)}
  .tabbar svg{width:26px;height:26px}
  .tabbar .ti{position:relative}
  .tabbar .count{position:absolute;top:-4px;right:-12px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--red);color:#fff}
  .scrim{padding:calc(40px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom));place-items:stretch}
  .sheet{max-width:none;border-radius:30px;padding:20px 16px;align-self:center}
  .acts button{height:52px;font-size:15px}
  .contact a,.contact button.cp{height:40px}
  .times{grid-template-columns:repeat(3,1fr)}
  .times button{height:44px;font-size:14px}
  .pk-save{height:52px;font-size:15px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom));max-width:calc(100% - 32px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}

<script>
(function(){
'use strict';
var Z = window.ZCRM;
var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function store(k, v){ try{ if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(_){ return null; } }

/* ---------- state ---------- */
var OPEN_LEAD = new URLSearchParams(location.search).get('lead') || '';
var KEY = (function(){
  var q = new URLSearchParams(location.search).get('key');
  if (q) store('zl_admin_key', q);
  if (q || OPEN_LEAD) history.replaceState(null, '', location.pathname);
  return store('zl_admin_key') || '';
})();
var LEADS = [];            // [{id, ts, name, ..., state, canUndo}]
var SEEN = {};             // ids already drawn, so only new ones animate in
var view = store('zcrm_view') || 'pipeline';
if (['pipeline','today','leads'].indexOf(view) === -1) view = 'pipeline';
var openId = null, pickMode = null, query = '';
var calMonth = null, calDay = null;
var lastSync = 0, timeOff = 0;
function now(){ return Date.now() + timeOff; }

/* ---------- derived ---------- */
function D(l){ return Z.derive(l, l.state, l.booking, now()); }
function initials(n){ var p = String(n||'?').trim().split(/\s+/); return ((p[0]||'')[0] || '?').toUpperCase() + (p.length > 1 ? (p[p.length-1][0]||'').toUpperCase() : ''); }
function match(l){
  if (!query) return true;
  var q = query.toLowerCase(), d = q.replace(/\D/g, '');
  return l.name.toLowerCase().indexOf(q) !== -1 || (d.length > 2 && l.phone.replace(/\D/g,'').indexOf(d) !== -1);
}
function stageLabel(d){ if (d.stage === 'done') return d.result === 'won' ? 'Won' : 'Not interested'; return Z.STAGES.filter(function(s){ return s.k === d.stage; })[0].label; }
function pill(d){ return '<span class="pill ' + (d.stage === 'done' ? d.result : d.stage) + '">' + stageLabel(d) + '</span>'; }
function dots(n, total){
  total = total || Z.TOTAL;
  var h = '<div class="dots" aria-label="' + n + ' of ' + total + ' calls">';
  for (var i = 0; i < total; i++) h += '<i class="' + (i < n ? 'on' : '') + '"></i>';
  return h + '<span>' + Math.min(n, total) + '/' + total + '</span></div>';
}
function nextLine(d){
  if (d.stage === 'done') return '';
  if (!d.next) return '<span class="nx"><svg><use href="#i-clock"/></svg>' + (d.kind === 'finished' ? 'All calls made' : 'No time set') + '</span>';
  var t = now();
  if (d.kind === 'booked') return '<span class="nx booked"><svg><use href="#i-cal"/></svg>' + esc(Z.when(d.next, t)) + '</span>';
  if (d.overdue) return '<span class="nx over" title="Was due ' + esc(Z.when(d.next, t)) + '"><span class="live"></span>Overdue · ' + Z.ago(d.next, t) + '</span>';
  if (d.due) return '<span class="nx due"><span class="live"></span>Call now</span>';
  return '<span class="nx"><svg><use href="#i-clock"/></svg>' + esc(Z.when(d.next, t)) + '</span>';
}
function stepLabel(d){
  if (d.kind === 'booked') return 'Booked call';
  if (d.kind === 'followup') return 'Follow-up';
  if (d.kind === 'cadence') return 'Call ' + (d.noAnswers + 1) + ' of ' + d.total + ' · ' + d.step;
  return '';
}

/* ---------- header ---------- */
var TITLES = { pipeline:'Pipeline', today:'Today', leads:'Leads' };
function sabEnd(sab, t){ return (Z.dayStart(sab.end) === Z.dayStart(t) ? '' : Z.DOW[Z.parts(sab.end).dow] + ' ') + Z.time12(sab.end); }
function renderHeader(){
  var t = now(), p = Z.parts(t);
  $('#date').textContent = Z.DOW[p.dow] + ', ' + Z.MON[p.m-1] + ' ' + p.d;
  $('#clock').textContent = Z.time12(t);
  var chips = '', sab = Z.sabbath(t);
  if (sab && view !== 'today') chips += '<span class="chip sab"><svg><use href="#i-moon"/></svg>Sabbath until ' + sabEnd(sab, t) + '</span>';
  var dueN = LEADS.filter(function(l){ var d = D(l); return d.stage !== 'done' && d.next && d.next <= t + 15*60e3; }).length;
  if (dueN && view !== 'today') chips += ' <span class="chip warn"><span class="ld"></span>' + dueN + ' to call now</span>';
  $('#chips').innerHTML = chips;
  var todayN = LEADS.filter(function(l){ var d = D(l); return d.stage !== 'done' && d.next && d.next < Z.dayStart(t) + 864e5; }).length;
  ['#todayCount','#todayCount2'].forEach(function(id){ var c = $(id); c.textContent = todayN; c.hidden = !todayN; });
}

/* ---------- pipeline ---------- */
var MQ = window.matchMedia('(max-width:860px)');
var mStage = store('zcrm_mstage') || '';
function cardHTML(l, d, s, fresh, i){
  var t = now();
  var h = '<div class="card' + (fresh ? ' rv' : '') + '" style="--i:' + i + '" draggable="' + (MQ.matches ? 'false' : 'true') + '" role="button" tabindex="0" data-id="' + esc(l.id) + '">'
    + '<span class="r1"><span class="nm">' + esc(l.name || 'No name') + '</span><span class="age" title="Lead age">' + Z.ago(l.ts, t) + '</span></span>'
    + (l.ad ? '<span class="ad">' + esc(l.ad) + '</span>' : '');
  if (s === 'done') h += '<span class="tag ' + d.result + '">' + stageLabel(d) + '</span>';
  else {
    if (s === 'new' || s === 'calling') h += dots(d.noAnswers, d.total);
    h += nextLine(d);
    if (l.phone) h += '<a class="callbtn mcall" href="tel:' + esc(l.phone.replace(/[^\d+]/g,'')) + '" aria-label="Call ' + esc(l.name) + '" data-stop><svg><use href="#i-phone"/></svg></a>';
  }
  return h + '</div>';
}
function stageRows(k){
  var rows = LEADS.filter(match).map(function(l){ return { l:l, d:D(l) }; }).filter(function(x){ return x.d.stage === k; });
  rows.sort(function(a, b){
    if (k === 'done') return (b.l.state && b.l.state.updated || b.l.ts) - (a.l.state && a.l.state.updated || a.l.ts);
    return (a.d.next || 9e15) - (b.d.next || 9e15) || b.l.ts - a.l.ts;
  });
  return rows;
}
/* phone: one stage at a time, picked from a row of tabs */
function renderBoardMobile(anim){

function renderToday(anim){
  var t = now(), start = Z.dayStart(t), end = start + 864e5, end2 = end + 864e5;

  var over = all.filter(function(x){ return x.d.next < t - 5*60e3; });
  var today = all.filter(function(x){ return x.d.next >= t - 5*60e3 && x.d.next < end; });

  if (sab) html += '<div class="banner' + (anim ? ' rv' : '') + '"><svg><use href="#i-moon"/></svg><span><b>Sabbath until ' + sabEnd(sab, t) + '.</b> Calls start after sunset.</span></div>';
  function grp(title, list, cls){
    if (!list.length) return '';

  }

  if (!over.length && !today.length && !tom.length) html += '<div class="list' + (anim ? ' rv' : '') + '"><div class="nothing"><b>' + (loaded ? 'No calls due' : 'Loading…') + '</b>' + (loaded ? 'New leads show up here the moment they come in.' : '') + '</div></div>';

}

var loaded = false, inflight = null;
function setSync(cls, text){ var s = $('#sync'); s.className = 'sync ' + (cls||''); $('#syncText').textContent = text; }
function syncLabel(){
  if (!lastSync) return;
  var s = Math.round((Date.now() - lastSync) / 1000);
  setSync('', s < 10 ? 'Synced just now' : s < 60 ? 'Synced ' + s + 's ago' : 'Synced ' + Math.round(s/60) + 'm ago');
}
function api(method, body){
  return fetch('/api/crm', {
    method: method,
    headers: Object.assign({ 'x-crm-key': KEY }, body ? { 'Content-Type':'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    if (r.status === 401){ lock(); throw new Error('key'); }
    return r.json().then(function(j){ if (!r.ok || !j.ok) throw new Error(j.error || r.status); return j; });
  });
}
function load(first){
  if (!KEY){ lock(); return; }
  if (inflight) return inflight;
  setSync('busy', 'Syncing');
  inflight = api('GET').then(function(j){
    timeOff = j.now - Date.now();
    fetch('/api/remind').catch(function(){});   // the CRM being open also keeps reminders on time
    var hadAny = loaded;

    .then(function(){ inflight = null; });

/* ---------- actions (instant on screen, saved in the background) ---------- */
function find(id){ return LEADS.filter(function(l){ return l.id === id; })[0]; }
var TOAST = { restart:'Call plan restarted', no_answer:'No answer logged', talked:'Marked talked', booked:'Call booked', won:'Marked won', lost:'Marked not interested', reopen:'Reopened', stage:'Moved', undo:'Undone' };
var QUEUE = {};   // one save at a time per lead, in order
function act(id, a){
  var l = find(id); if (!l) return;
  var before = { state: l.state, canUndo: l.canUndo };
  if (a.action !== 'undo') l.canUndo = true;
  l.state = Z.apply(l.state, a, now());
  delete l.state.hist;
  if (a.action !== 'note'){ render(false); flash(id); if (openId === id) refreshSheet(); toast(TOAST[a.action] || 'Saved', a.action !== 'undo' ? id : null); }
  var run = (QUEUE[id] || Promise.resolve()).then(function(){ return api('POST', Object.assign({ id: id }, a)); });
  QUEUE[id] = run.catch(function(){});
  return run.then(function(j){
    l.state = j.state; l.canUndo = j.canUndo;
    store('zcrm_cache', JSON.stringify({ at: lastSync, leads: LEADS }));
    render(false); if (openId === id) refreshSheet();
    return true;
  }).catch(function(e){
    if (e.message === 'key') return false;
    l.state = before.state; l.canUndo = before.canUndo;
    render(false); if (openId === id) refreshSheet();
    toast('Couldn’t save. Check the connection and try again.');
    return false;
  });
}
function flash(id){
  var c = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
  if (c){ c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
}

/* ---------- the time picker: day chips + time chips, Toronto time ---------- */
var pkDay = null, pkAt = null;
function slotsFor(ymd){
  var p = ymd.split('-'), out = [], t = now();
  for (var m = Z.CALL_START; m <= Z.CALL_END; m += 30){
    var ts = Z.at(+p[0], +p[1], +p[2], m);
    if (ts > t + 10*60e3 && Z.allowed(ts) === ts) out.push(ts);
  }
  return out;
}
function pickerDays(){ var t = now(), out = []; for (var i = 0; i < 14; i++){ var d = Z.dateAfter(t, i); out.push(d.y + '-' + Z.pad(d.m) + '-' + Z.pad(d.d)); } return out; }
function pickerReset(){
  var want = Z.tomorrowMorning(now()), days = pickerDays();
  pkDay = null; pkAt = null;
  for (var i = 0; i < days.length && !pkAt; i++){
    var sl = slotsFor(days[i]).filter(function(ts){ return ts >= want - 60e3; });
    if (sl.length){ pkDay = days[i]; pkAt = sl[0]; }
  }
}
function pickerHTML(){
  if (!pkDay) pickerReset();
  var t = now(), todayKey = Z.ymd(t), tom = Z.ymd(Z.dayStart(t) + 36*3600e3);
  var h = '<div class="picker"><div class="h">' + (pickMode === 'booked' ? 'When is the call?' : 'When to follow up?') + ' <small>Toronto time</small></div><div class="days" id="pkDays">';
  pickerDays().forEach(function(k){
    var p = k.split('-'), ts = Z.at(+p[0], +p[1], +p[2], 720), pp = Z.parts(ts), n = slotsFor(k).length;
    var top = k === todayKey ? 'Today' : k === tom ? 'Tmrw' : Z.DOW[pp.dow];
    h += '<button type="button" class="day' + (k === pkDay ? ' sel' : '') + '" data-pkday="' + k + '"' + (n ? '' : ' disabled title="No call times"') + '><small>' + top + '</small><b>' + pp.d + '</b></button>';
  });
  h += '</div>';
  var slots = slotsFor(pkDay), groups = [['Morning', 0, 720], ['Afternoon', 720, 1020], ['Evening', 1020, 1441]];
  if (!slots.length) h += '<div class="none">No call times left this day.</div>';
  groups.forEach(function(g){
    var list = slots.filter(function(ts){ var p = Z.parts(ts), m = p.h*60 + p.mi; return m >= g[1] && m < g[2]; });
    if (!list.length) return;
    h += '<div class="tg"><span>' + g[0] + '</span><div class="times">' + list.map(function(ts){
      return '<button type="button" data-pkat="' + ts + '"' + (ts === pkAt ? ' class="sel"' : '') + '>' + Z.time12(ts).replace(' ', ' ') + '</button>';
    }).join('') + '</div></div>';
  });
  var ok = pkAt && Z.ymd(pkAt) === pkDay;
  h += '<button type="button" class="pk-save" data-save' + (ok ? '' : ' disabled') + '>' + (pickMode === 'booked' ? 'Book' : 'Set follow-up') + (ok ? ' · ' + esc(Z.when(pkAt, t)) : '') + '</button></div>';
  return h;
}

  }
  if ((b = e.target.closest('[data-pick]'))){
    pickMode = pickMode === b.dataset.pick ? null : b.dataset.pick; pkDay = null; refreshSheet();
    var pk = document.querySelector('#sheet .picker'); if (pk) pk.scrollIntoView({ block:'nearest', behavior:'smooth' });
    return;
  }
  if ((b = e.target.closest('[data-pkday]'))){
    pkDay = b.dataset.pkday; var sl = slotsFor(pkDay);
    if (!pkAt || Z.ymd(pkAt) !== pkDay){ var p = Z.parts(pkAt || 0), want = p.h*60 + p.mi; pkAt = sl.filter(function(ts){ var q = Z.parts(ts); return q.h*60 + q.mi >= want; })[0] || sl[0] || null; }
    redrawPicker(); return;
  }
  if ((b = e.target.closest('[data-pkat]'))){ pkAt = +b.dataset.pkat; redrawPicker(); return; }
  if ((b = e.target.closest('[data-save]'))){
    var at = pkAt;
    if (!at) return;
    act(openId, { action: pickMode, at: at }); pickMode = null; refreshSheet(); return;
  }
  if ((b = e.target.closest('[data-act]'))){ act(openId, { action: b.dataset.act }); }
});
$('#scrim').addEventListener('mousedown', function(e){ if (e.target.id === 'scrim') closeSheet(); });

/* open a lead from anywhere */
document.addEventListener('click', function(e){
  if (e.target.closest('[data-stop]')) return;
  var c = e.target.closest('.card[data-id], .row[data-id]');
  if (c && !$('#sheet').contains(c)) openSheet(c.dataset.id);
  var cb = e.target.closest('[data-cal]');
  if (cb){ var m = calMonth.m + (+cb.dataset.cal), y = calMonth.y; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; } calMonth = { y:y, m:m }; renderLeads(false); }
  var db = e.target.closest('[data-day]');
  if (db && !db.disabled){ calDay = db.dataset.day; renderLeads(false); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ if (openId) return closeSheet(); if (document.activeElement === $('#q')){ $('#q').value = ''; query = ''; render(false); $('#q').blur(); } }
  var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (typing) return;
  if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('.row[data-id], .card[data-id]')) openSheet(document.activeElement.dataset.id);
  if (openId) return;
  if (e.key === '/'){ e.preventDefault(); $('#q').focus(); }
  if (e.key === '1') show('pipeline'); if (e.key === '2') show('today'); if (e.key === '3') show('leads');
});
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-stab]'); if (!b) return;
  mStage = b.dataset.stab; store('zcrm_mstage', mStage); renderBoardMobile(true);
});
MQ.addEventListener && MQ.addEventListener('change', function(){ render(false); });
$('#q').addEventListener('input', function(){ query = this.value.trim(); render(false); });

/* ---------- drag between columns ---------- */
var dragging = null;
$('#board').addEventListener('dragstart', function(e){
  var c = e.target.closest('.card'); if (!c) return;
  dragging = c.dataset.id; c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragging); }catch(_){}
});
$('#board').addEventListener('dragend', function(){
  $$('.card.dragging').forEach(function(c){ c.classList.remove('dragging'); });
  $$('.col.over').forEach(function(c){ c.classList.remove('over'); });
  dragging = null;
});
$('#board').addEventListener('dragover', function(e){
  var col = e.target.closest('.col'); if (!col || !dragging) return;
  e.preventDefault();
  if (!col.classList.contains('over')){ $$('.col.over').forEach(function(c){ c.classList.remove('over'); }); col.classList.add('over'); }
});
$('#board').addEventListener('dragleave', function(e){
  var col = e.target.closest('.col'); if (col && !col.contains(e.relatedTarget)) col.classList.remove('over');
});
$('#board').addEventListener('drop', function(e){
  var col = e.target.closest('.col'); if (!col || !dragging) return;
  e.preventDefault();
  var id = dragging, to = col.dataset.stage, l = find(id);
  dragging = null;
  $$('.col.over').forEach(function(c){ c.classList.remove('over'); });
  if (!l || D(l).stage === to) return render(false);
  if (to === 'booked' || to === 'talked'){ render(false); openSheet(id); pickMode = to; pkDay = null; refreshSheet(); return; }
  if (to === 'done'){ render(false); openSheet(id); return; }
  act(id, { action:'stage', stage: to });
});

/* ---------- key gate ---------- */
function lock(){
  KEY = ''; store('zl_admin_key', null);
  $('#gate').hidden = false; $('#app').style.filter = 'blur(14px)'; $('#app').style.pointerEvents = 'none';
  setTimeout(function(){ $('#gateKey').focus(); }, 50);
}
$('#gateForm').addEventListener('submit', function(e){
  e.preventDefault();
  var k = $('#gateKey').value.trim(); if (!k) return;
  KEY = k; $('#gateErr').textContent = '';
  api('GET').then(function(j){
    store('zl_admin_key', k);
    $('#gate').hidden = true; $('#app').style.filter = ''; $('#app').style.pointerEvents = '';
    timeOff = j.now - Date.now(); LEADS = j.leads; loaded = true; lastSync = Date.now(); syncLabel();
    store('zcrm_cache', JSON.stringify({ at: lastSync, leads: LEADS }));
    show(view, true);
  }).catch(function(){
    $('#gateErr').textContent = 'That key didn’t work.';
    var f = $('#gateForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    $('#gate').hidden = false;
  });
});

/* ---------- start ---------- */
try{
  var cache = JSON.parse(store('zcrm_cache') || 'null');
  if (cache && cache.leads && KEY){ LEADS = cache.leads; loaded = true; lastSync = cache.at; }
}catch(_){}
show(view, true);
window.addEventListener('resize', moveNavPill);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveNavPill);
load(!loaded);
setInterval(function(){ renderHeader(); syncLabel(); }, 15000);
setInterval(function(){ if (!document.hidden && !openId) load(); }, 45000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
</body>
