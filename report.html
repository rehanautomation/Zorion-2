<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zorion Life — Funnel report</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
:root{
  --text:#111827;
  --muted:#6B7280;
  --line:#E5E7EB;
  --soft:#F3F4F6;
  --accent:#2563EB;     /* bars and the active tab, nothing else */
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  margin:0;background:#fff;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}

/* ---- header ---- */
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{font-weight:600}
.head-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wipe{border:0;background:none;padding:6px 0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---- tabs: every switch on the page looks the same ---- */
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{
  border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;
  padding:6px 10px;color:var(--muted);
}
.tabs button:hover{color:var(--text)}
.tabs button.is-on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs.under{border-bottom:1px solid var(--line)}
.tabs.under button{margin-bottom:-1px}

main{padding:24px 0 64px}
section{margin-top:36px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)}

/* ---- 1. summary strip ---- */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:20px}
.strip.wide{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.strip b{display:block;font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strip span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.since{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.since + .since{margin-top:2px;padding-top:0;border-top:0}

/* ---- 2. funnel ---- */
.funnel{border-top:1px solid var(--line)}
.step{
  display:grid;grid-template-columns:minmax(0,13rem) 1fr 3.5rem;align-items:center;gap:14px;
  padding:9px 8px;border-bottom:1px solid var(--line);
}
.step .name{min-width:0}
.step .name small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.step .count{text-align:right;font-variant-numeric:tabular-nums}
.step.worst{background:var(--soft)}
.step.worst .name{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--soft)}
.step.worst .bar{background:#fff}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* ---- 3. tables ---- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;max-width:100%}
table{width:100%;border-collapse:collapse}
.scroll table{min-width:640px}
.scroll table.narrow{min-width:0}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:13px;font-weight:500;color:var(--muted);background:#fff}
td{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff}
td:first-child{max-width:16rem;overflow:hidden;text-overflow:ellipsis}
td.none{color:var(--muted)}
td.wrap-text{white-space:normal}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-left:6px}
.empty{margin:0;padding:12px 0;color:var(--muted)}
#tabs{margin-bottom:12px}

/* ---- 4. collapsed sections ---- */
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:600;display:flex;align-items:baseline;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:'\25B8';color:var(--muted);font-size:12px;width:12px;flex:none}
details[open]>summary::before{content:'\25BE'}
summary .muted{font-weight:400;font-size:13px}
details .inner{padding:0 0 20px}
details .inner>section:first-of-type{margin-top:28px}
.locked{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--text)}
.btn:hover{background:var(--soft)}

@media (max-width:600px){
  .strip{grid-template-columns:repeat(3,1fr);gap:16px 12px}
  .strip b{font-size:24px}
  .step{grid-template-columns:minmax(0,11rem) 1fr 2.75rem;gap:10px;padding:9px 6px}
  td:first-child{max-width:10rem}
}
@media (max-width:400px){
  .tabs button{padding:6px 8px;font-size:14px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="brand">Zorion Life · Funnel report</span>
    <div class="head-right">
      <div class="tabs" id="filters">
        <button data-days="1">24h</button>
        <button data-days="7">7d</button>
        <button data-days="30">30d</button>
        <button data-days="0" class="is-on">All</button>
      </div>
      <button class="wipe" id="wipe" title="Delete every stored event">Wipe data</button>
    </div>
  </div>
</header>

<main class="wrap" id="app">Loading…</main>

<script>
var days = 0;
var mode = 'verified';            // 'verified' | 'all'
var tab = 'byA';                  // which breakdown is showing
var last = null;

/* which collapsed sections are open survives the 30-second refresh */
var OPEN = (function(){ try{ return JSON.parse(sessionStorage.getItem('zl_open') || '{}'); }catch(_){ return {}; } })();

/* Lead names only come back with the admin key. It is read from
   ?key= once, then remembered on this device only. */
var KEY = (function(){
  try{
    var q = new URLSearchParams(location.search).get('key');
    if (q) { localStorage.setItem('zl_admin_key', q); history.replaceState(null, '', location.pathname); }
    return localStorage.getItem('zl_admin_key') || '';
  }catch(_){ return ''; }
})();

var TABS = [
  {key:'byA',   label:'By ad',        none:'not tagged'},
  {key:'bySrc', label:'By platform',  none:'not tagged'},
  {key:'byPl',  label:'By placement', none:'not tagged'},
  {key:'byDay', label:'By day',       none:'—'}
];

/* ---------------------------------------------------------------
   BASELINE: real ad visitors from before the new tracker went live.
   Classified by hand and matched to Meta's landing page views, so
   it is fixed, not computed. All of them stopped at Q1: nobody
   answered, no leads.

   Added to the "Real ad clicks" view only, and only to People, the
   Q1 step of the funnel and the By ad table. Never to Engaged or the
   time numbers: the old timer wasn't reliable. It counts in a date
   window only when that window reaches back to `until`.
   --------------------------------------------------------------- */
var BASELINE = {
  until: Date.parse('2026-10-08T23:06:00Z'),   // Oct 8, 2026, 7:06 PM Toronto
  label: 'Oct 8, 7:06 PM',
  byA: { widow: 14, locked: 1, debt: 0, competitor: 0 }
};

function baselineTotal(){
  return Object.keys(BASELINE.byA).reduce(function(t, k){ return t + BASELINE.byA[k]; }, 0);
}
function baselineApplies(){
  return mode === 'verified' && baselineTotal() > 0
    && (!days || Date.now() - days * 86400000 <= BASELINE.until);
}
/* A copy of the verified block with the baseline added. Everyone in
   it reached Q1 and stopped there, so it lands on step 1 only. */
function withBaseline(b){
  var n = baselineTotal();
  var out = JSON.parse(JSON.stringify(b));
  var rate = function(l, v){ return v ? Math.round((l / v) * 1000) / 10 : 0; };
  out.totals.views = (out.totals.views || 0) + n;
  out.totals.conversionRate = rate(out.totals.leads || 0, out.totals.views);
  (out.steps || []).forEach(function(s){
    if (s.step === 1){ s.reached += n; s.droppedHere += n; }
  });
  out.byA = out.byA || [];
  Object.keys(BASELINE.byA).forEach(function(k){
    var add = BASELINE.byA[k];
    if (!add) return;
    var row = out.byA.filter(function(r){ return r.key === k; })[0];
    if (!row){
      row = {key:k, views:0, engaged:0, started:0, leads:0, conversionRate:0,
             visibleMedianMs:0, visibleAvgMs:0, landingMedianMs:0, firstAnswerMedianMs:0};
      out.byA.push(row);
    }
    row.views += add;
    row.conversionRate = rate(row.leads, row.views);
  });
  out.byA.sort(function(x, y){ return y.views - x.views; });
  return out;
}

function esc(s){ return String(s == null ? '' : s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }

function render(d){
  last = d;
  var b = d[mode] || {totals:{}, steps:[], byA:[], bySrc:[], byPl:[], byDay:[]};
  var base = baselineApplies();
  if (base) b = withBaseline(b);
  var t = b.totals || {};
  var who = mode === 'verified' ? 'People' : 'Visits';
  var html = '';

  html += '<div class="tabs under" id="seg">'
    + '<button data-mode="verified"' + (mode === 'verified' ? ' class="is-on"' : '') + '>Real ad clicks</button>'
    + '<button data-mode="all"' + (mode === 'all' ? ' class="is-on"' : '') + '>All traffic</button>'
    + '</div>';

  /* ---- 1. summary ---- */
  html += '<div class="strip">'
    + num(t.views, who) + num(t.engaged, 'Engaged') + num(t.started, 'Answered Q1')
    + num(t.leads, 'Leads') + num(dur(t.visibleMedianMs), 'Median time')
    + '</div>';
  html += '<p class="since">' + (d.trackingSince
    ? 'Counting real ad clicks since ' + esc(stamp(d.trackingSince.ts)) + ' (Toronto)'
    : 'Waiting for the first visit.') + '</p>';
  if (base){
    html += '<p class="since">Includes ' + baselineTotal() + ' real visitors from before '
      + esc(BASELINE.label) + ', matched to Meta.</p>';
  }

  /* ---- 2. funnel ---- */
  html += '<section><h2>Funnel</h2>' + funnel(b.steps, t.views) + '</section>';

  /* ---- 3. breakdowns ---- */
  var cfg = TABS.filter(function(x){ return x.key === tab; })[0];
  html += '<section><div class="tabs under" id="tabs">'
    + TABS.map(function(x){ return '<button data-tab="' + x.key + '"' + (x.key === tab ? ' class="is-on"' : '') + '>' + x.label + '</button>'; }).join('')
    + '</div>' + breakdown(b[tab], cfg, who) + '</section>';

  /* ---- 4. collapsed ---- */
  html += '<section>';

  var f = d.filtered || {total:0, byReason:[]};
  var allViews = (d.all && d.all.totals && d.all.totals.views) || 0;
  html += fold('filtered', 'Filtered out', '(' + (f.total || 0) + ')',
    (f.byReason && f.byReason.length)
      ? '<div class="scroll"><table class="narrow"><tr><th>Why it wasn’t counted</th><th>Visits</th></tr>'
        + f.byReason.map(function(r){
            var pc = allViews ? Math.round(r.count / allViews * 100) : 0;
            return '<tr><td class="wrap-text">' + esc(r.label) + '<code>' + esc(r.reason) + '</code></td><td>' + r.count + ' · ' + pc + '%</td></tr>';
          }).join('')
        + '</table></div>'
      : '<p class="empty">Nothing filtered in this window.</p>');

  html += fold('leads', 'Leads', d.admin && d.leads ? '(' + d.leads.length + ')' : '', leadsTable(d.leads, d.admin, true));

  var L = d.legacy;
  if (L && L.totals && L.totals.views){
    html += fold('old', 'Before new tracking',
      L.totals.views + ' visits' + (L.from ? ', ' + day(L.from) + ' to ' + day(L.to) : ''),
      legacy(L, d.admin));
  }
  html += '</section>';

  if (!d.persistent){
    html += '<p class="since">Storage is temporary. Add <code>KV_REST_API_URL</code> and <code>KV_REST_API_TOKEN</code> '
      + 'env vars (Vercel KV / Upstash free tier) to keep stats permanently. Leads still reach Discord either way.</p>';
  }

  document.getElementById('app').innerHTML = html;
}

function num(n, label){
  return '<div><b>' + (n == null ? 0 : n) + '</b><span>' + label + '</span></div>';
}

/* One row per step. The bar is the share of everyone who got this far;
   the step the most people stopped at is shaded. */
function funnel(steps, views){
  steps = steps || [];
  var worst = null;
  steps.forEach(function(s){ if (s.droppedHere > 0 && (!worst || s.droppedHere > worst.droppedHere)) worst = s; });
  return '<div class="funnel">' + steps.map(function(s){
    var pc = views ? Math.min(100, (s.reached / views) * 100) : 0;
    var isWorst = s === worst;
    return '<div class="step' + (isWorst ? ' worst' : '') + '">'
      + '<div class="name">' + esc(s.label) + (isWorst ? '<small>biggest drop</small>' : '') + '</div>'
      + '<div class="bar"><i style="width:' + pc.toFixed(1) + '%"></i></div>'
      + '<div class="count">' + s.reached + '</div>'
      + '</div>';
  }).join('') + '</div>';
}

function breakdown(rows, cfg, who){
  rows = rows || [];
  if (!rows.length) return '<p class="empty">Nothing yet in this window.</p>';
  if (rows.every(function(r){ return r.key === '(none)'; })) return '<p class="empty">Not tagged yet</p>';
  return '<div class="scroll"><table>'
    + '<tr><th>Name</th><th>' + who + '</th><th>Engaged</th><th>Answered</th><th>Leads</th><th>Conv %</th><th>Median time</th><th>To Q1</th></tr>'
    + rows.map(function(r){
        var none = r.key === '(none)';
        var name = none ? cfg.none : r.key;
        return '<tr><td' + (none ? ' class="none"' : '') + ' title="' + esc(name) + '">' + esc(name) + '</td>'
          + '<td>' + r.views + '</td><td>' + r.engaged + '</td><td>' + r.started + '</td><td>' + r.leads + '</td>'
          + '<td>' + r.conversionRate + '%</td><td>' + dur(r.visibleMedianMs) + '</td><td>' + dur(r.firstAnswerMedianMs) + '</td></tr>';
      }).join('')
    + '</table></div>';
}

function fold(id, title, note, body){
  return '<details id="fold-' + id + '"' + (OPEN[id] ? ' open' : '') + '><summary>' + title
    + (note ? ' <span class="muted">' + esc(note) + '</span>' : '') + '</summary>'
    + '<div class="inner">' + body + '</div></details>';
}

function leadsTable(leads, admin, isV2){
  if (!admin){
    return '<div class="locked"><span>Names, emails and phone numbers are hidden on the public report.</span>'
      + '<button type="button" class="btn" data-unlock="1">Show lead details</button></div>';
  }
  if (!leads || !leads.length) return '<p class="empty">No leads yet in this window.</p>';
  return '<div class="scroll"><table><tr><th>When (Toronto)</th>' + (isV2 ? '<th>Counted</th><th>Ad</th>' : '')
    + '<th>Name</th><th>Email</th><th>Phone</th></tr>'
    + leads.map(function(l){
        return '<tr><td>' + esc(when(l.ts)) + '</td>'
          + (isV2 ? '<td' + (l.verified ? '' : ' class="none"') + '>' + (l.verified ? 'real click' : 'not verified') + '</td><td>' + esc(l.a || '—') + '</td>' : '')
          + '<td>' + esc(l.name) + '</td><td>' + esc(l.email) + '</td><td>' + esc(l.phone) + '</td></tr>';
      }).join('')
    + '</table></div>';
}

function legacy(L, admin){
  var t = L.totals, views = t.views || 0;
  var html = '<div class="strip wide">'
    + num(views, 'Total views') + num(t.attempted, 'Attempted &amp; left') + num(t.bounced, 'Left immediately')
    + num(t.leads, 'Leads submitted') + num(t.conversionRate + '%', 'Conversion rate')
    + num(dur(t.avgLandingMs), 'Avg time on Q1') + num(dur(t.avgSessionMs), 'Avg time on page')
    + '</div>';
  html += '<section><h2>Funnel</h2>' + funnel(L.steps, views) + '</section>';
  var vs = L.variants || [];
  html += '<section><h2>Traffic by ad variant</h2>';
  html += !vs.length ? '<p class="empty">Nothing in this window.</p>'
    : '<div class="scroll"><table><tr><th>Name</th><th>Views</th><th>Started</th><th>Leads</th><th>Conv %</th><th>On Q1</th><th>Total</th></tr>'
      + vs.map(function(v){
          var none = v.variant === '(none)';
          return '<tr><td' + (none ? ' class="none"' : '') + '>' + (none ? 'direct' : esc(v.variant)) + '</td>'
            + '<td>' + v.views + '</td><td>' + v.started + '</td><td>' + v.leads + '</td><td>' + v.conversionRate + '%</td>'
            + '<td>' + dur(v.avgLandingMs) + '</td><td>' + dur(v.avgSessionMs) + '</td></tr>';
        }).join('')
      + '</table></div>';
  html += '</section>';
  if (admin) html += '<section><h2>Leads</h2>' + leadsTable(L.leads, true, false) + '</section>';
  return html;
}

/* 0 reads as "no data", not "instant" — show a dash instead. */
function dur(ms){
  if (!ms) return '—';
  var s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60);
  return m + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '');
}
var TZ = {timeZone:'America/Toronto'};
function stamp(ts){ try{ return new Date(ts).toLocaleString('en-US', Object.assign({month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}, TZ)); }catch(_){ return new Date(ts).toLocaleString(); } }
function when(ts){ try{ return new Date(ts).toLocaleString('en-CA', Object.assign({dateStyle:'medium', timeStyle:'short'}, TZ)); }catch(_){ return new Date(ts).toLocaleString(); } }
function day(ts){ try{ return new Date(ts).toLocaleDateString('en-CA', Object.assign({month:'short', day:'numeric'}, TZ)); }catch(_){ return ''; } }

function load(){
  var url = '/api/stats?days=' + days + (KEY ? '&key=' + encodeURIComponent(KEY) : '');
  fetch(url, {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      /* a key that no longer works is forgotten, not retried forever */
      if (KEY && !d.admin){ KEY = ''; try{ localStorage.removeItem('zl_admin_key'); }catch(_){} }
      render(d);
    })
    .catch(function(){ document.getElementById('app').innerHTML = '<p class="empty">Could not load stats. Is /api/stats deployed?</p>'; });
}

document.getElementById('app').addEventListener('click', function(e){
  var seg = e.target.closest('#seg button');
  if (seg){ mode = seg.getAttribute('data-mode'); if (last) render(last); return; }
  var tb = e.target.closest('#tabs button');
  if (tb){ tab = tb.getAttribute('data-tab'); if (last) render(last); return; }
  if (e.target.closest('[data-unlock]')){
    var k = prompt('Admin key (ADMIN_KEY in Vercel):');
    if (!k) return;
    KEY = k; try{ localStorage.setItem('zl_admin_key', k); }catch(_){}
    load();
  }
});
document.getElementById('app').addEventListener('toggle', function(e){
  var id = (e.target.id || '').replace(/^fold-/, '');
  if (!id) return;
  OPEN[id] = e.target.open;
  try{ sessionStorage.setItem('zl_open', JSON.stringify(OPEN)); }catch(_){}
}, true);

/* Deletes everything, so it asks twice: once for the key, once to be
   sure. There is no undo. */
document.getElementById('wipe').addEventListener('click', function(){
  var key = prompt('Admin key (set as ADMIN_KEY in Vercel):');
  if (!key) return;
  if (!confirm('Delete every stored event? This cannot be undone.')) return;
  fetch('/api/reset', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ key: key })
  })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.ok) { alert('Deleted ' + d.deleted + ' events. Report is now empty.'); load(); }
      else alert('Not wiped: ' + (d.error || 'unknown error'));
    })
    .catch(function(){ alert('Could not reach /api/reset. Is it deployed?'); });
});

document.getElementById('filters').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b) return;
  days = Number(b.getAttribute('data-days'));
  [].forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('is-on', x === b); });
  load();
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
