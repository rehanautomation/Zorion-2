<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zorion Life — Funnel report</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#10243A; --slate:#52657A; --slate-light:#8698A9;
  --sky:#F4F8FB; --white:#fff; --line:#D6E3EE; --blue:#1D6FB8; --amber:#D9822B;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--slate);font-family:Inter,sans-serif;font-size:15px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header .brand{font-family:Archivo,sans-serif;font-weight:700;letter-spacing:.08em;font-size:15px}
.filters{display:flex;gap:8px}
.filters button{
  border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;
  font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer;
}
.filters button.is-on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 64px}
h2{font-family:Archivo,sans-serif;font-size:15px;color:var(--navy);margin:32px 0 12px;letter-spacing:.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card .n{display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--navy)}
.card .n.amber{color:var(--amber)}
.card .l{display:block;margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--slate-light)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.row{margin-bottom:14px}
.row:last-child{margin-bottom:0}
.row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.row .top b{color:var(--navy);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar u{position:absolute;top:0;left:0;height:100%;background:var(--amber);opacity:.9;border-radius:99px}
.drop{font-size:12px;color:var(--amber);font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-light);background:var(--sky)}
tr:last-child td{border-bottom:0}
.note{font-size:12px;color:var(--slate-light);margin-top:10px}
.warn{background:#FDF4EA;border:1px solid #F0D9BE;color:#8A5A1E;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--slate-light);margin-bottom:14px}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.legend .r::before{background:var(--blue)}
.legend .d::before{background:var(--amber)}

/* ---- traffic by ad variant ----
   Cards on a phone, one table row per variant on a wide screen. The
   same markup either way: the row items are grid cells below 700px and
   table cells above it. */
.vlist{display:grid;gap:10px}
.v{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 10px;
}
.v-name{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;color:var(--navy);word-break:break-word}
.v-name.none{font-weight:600;color:var(--slate-light)}
.v-conv{font-family:Archivo,sans-serif;font-weight:700;font-size:17px;color:var(--blue);white-space:nowrap;text-align:right}
.v .bar{grid-column:1/-1;margin-top:10px}
.v-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:12px}
.v-stats b{display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:16px;color:var(--navy);line-height:1.1}
.v-stats span{display:block;margin-top:3px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--slate-light)}

@media (min-width:700px){
  .vlist{display:table;width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;gap:0}
  .v{display:table-row;border:0;border-radius:0;padding:0}
  /* every direct child becomes a cell — including .v-stats, so its
     display must not be re-declared below */
  .v>*{display:table-cell;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .v:last-child>*{border-bottom:0}
  .v-name{width:30%}
  .v-conv{width:76px;text-align:left}
  .v .bar{display:none}
  .v-stats{margin-top:0;text-align:right}
  .v-stats>div{display:inline-block;min-width:58px;margin-left:24px;text-align:right;vertical-align:top}
}

/* ---- v2: what is being counted ---- */
.banner{
  display:flex;align-items:flex-start;gap:10px;margin:0 0 4px;
  background:#EAF3FB;border:1px solid #C9DDEF;border-radius:12px;padding:12px 16px;
  font-size:14px;color:var(--navy);
}
.banner::before{content:'';flex:none;width:9px;height:9px;margin-top:6px;border-radius:50%;background:#1F9D63;box-shadow:0 0 0 3px rgba(31,157,99,.18)}
.banner b{font-weight:600}
.banner small{display:block;font-size:12px;color:var(--slate);margin-top:2px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px;margin-top:16px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--slate);padding:7px 14px;border-radius:99px;cursor:pointer}
.seg button.is-on{background:var(--navy);color:#fff}
.mode-note{font-size:12.5px;color:var(--slate-light);margin:8px 0 0}
.v-stats.six{grid-template-columns:repeat(3,1fr)}
.reason td:last-child,.reason th:last-child{text-align:right;white-space:nowrap}
.reason code{display:inline-block;font-size:11px;color:var(--slate-light);background:var(--sky);padding:1px 6px;border-radius:4px;margin:3px 0 0 6px}
.tbl-scroll table.reason{min-width:0}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.tbl-scroll table{min-width:520px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
details.old{margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 18px}
details.old>summary{cursor:pointer;list-style:none;padding:16px 0;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;color:var(--navy)}
details.old>summary::-webkit-details-marker{display:none}
details.old>summary::after{content:'Show';float:right;font-family:Inter,sans-serif;font-weight:600;font-size:12px;color:var(--blue)}
details.old[open]>summary::after{content:'Hide'}
details.old>summary small{display:block;font-family:Inter,sans-serif;font-weight:400;font-size:12.5px;color:var(--slate-light);margin-top:2px}
details.old .inner{padding:0 0 18px}
details.old h2{margin-top:18px}
.locked{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.locked button{border:1px solid var(--line);background:var(--sky);color:var(--navy);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.tag.ok{background:#E3F4EC;color:#16784A}
.tag.no{background:#F2F4F7;color:var(--slate-light)}
</style>
</head>
<body>
<header>
  <span class="brand">ZORION LIFE · FUNNEL REPORT</span>
  <div class="filters" id="filters">
    <button data-days="1">24h</button>
    <button data-days="7">7d</button>
    <button data-days="30">30d</button>
    <button data-days="0" class="is-on">All</button>
    <button id="wipe" title="Delete every stored event" style="margin-left:14px;border-color:#5A2A2A;color:#D98A8A">Wipe data</button>
  </div>
</header>

<div class="wrap" id="app">Loading…</div>

<script>
var days = 0;
var mode = 'verified';            // 'verified' | 'all'
var last = null;

/* Lead names only come back with the admin key. It is read from
   ?key= once, then remembered on this device only. */
var KEY = (function(){
  try{
    var q = new URLSearchParams(location.search).get('key');
    if (q) { localStorage.setItem('zl_admin_key', q); history.replaceState(null, '', location.pathname); }
    return localStorage.getItem('zl_admin_key') || '';
  }catch(_){ return ''; }
})();

function esc(s){ return String(s == null ? '' : s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }

function render(d){
  last = d;
  var html = '';

  /* ---- what is being counted ---- */
  if (d.trackingSince){
    html += '<div class="banner"><div>Counting real ad clicks since <b>' + esc(d.trackingSince.toronto) + '</b>'
      + '<small>A visit counts when it carries a Meta click (an fbclid, or the Facebook / Instagram app), an a= ad tag, comes from Canada and isn’t a bot. Days are Toronto time.</small></div></div>';
  } else {
    html += '<div class="banner"><div>New tracking is live. <b>Waiting for the first visit.</b>'
      + '<small>Only real Meta ad clicks from Canada will be counted. Everything before this is in the section at the bottom.</small></div></div>';
  }

  html += '<div class="seg" id="seg">'
    + '<button data-mode="verified"' + (mode === 'verified' ? ' class="is-on"' : '') + '>Real ad clicks</button>'
    + '<button data-mode="all"' + (mode === 'all' ? ' class="is-on"' : '') + '>All traffic</button>'
    + '</div>'
    + '<p class="mode-note">' + (mode === 'verified'
        ? 'Each person counted once, the day they clicked. Reloads are folded into the same person.'
        : 'Every visit since the switch, including bots, link previews, reloads and visits without an ad.') + '</p>';

  var b = d[mode] || {totals:{}, steps:[], byA:[], bySrc:[], byPl:[], byDay:[]};
  var t = b.totals, views = t.views || 0;

  html += '<h2>Overview</h2><div class="cards">'
    + card(views, mode === 'verified' ? 'Real people' : 'Visits')
    + card(t.engaged, 'Engaged')
    + card(t.started, 'Answered Q1')
    + card(t.leads, 'Leads', true)
    + card(t.conversionRate + '%', 'Conversion', true)
    + card(dur(t.visibleMedianMs), 'Median time on page')
    + card(dur(t.visibleAvgMs), 'Average time on page')
    + card(dur(t.firstAnswerMedianMs), 'Median time to answer Q1')
    + '</div>'
    + '<p class="note">Time counts only while the page is on screen. Engaged = touched, clicked, typed or scrolled.</p>';

  html += steps(b.steps, views);
  html += breakdown('By ad (a=)', b.byA, 'no a= tag');
  html += breakdown('By platform (src=)', b.bySrc, 'not tagged');
  html += breakdown('By placement (pl=)', b.byPl, 'not tagged');
  html += breakdown('By day (Toronto time)', b.byDay, '—');

  /* ---- what was filtered out ---- */
  var f = d.filtered || {total:0, byReason:[]};
  html += '<h2>Filtered out (' + (f.total || 0) + ')</h2>';
  if (!f.byReason || !f.byReason.length){
    html += '<div class="panel">Nothing filtered in this window.</div>';
  } else {
    var allViews = (d.all && d.all.totals.views) || 0;
    html += '<div class="tbl-scroll"><table class="reason"><tr><th>Why it wasn’t counted</th><th class="num">Visits</th></tr>'
      + f.byReason.map(function(r){
          var pc = allViews ? Math.round(r.count / allViews * 100) : 0;
          return '<tr><td>' + esc(r.label) + '<code>' + esc(r.reason) + '</code></td><td class="num"><b>' + r.count + '</b> · ' + pc + '%</td></tr>';
        }).join('')
      + '</table></div>';
  }

  /* ---- leads ---- */
  html += leadsBlock(d.leads, d.admin, true);

  if (!d.persistent){
    html += '<div class="warn"><b>Storage is temporary.</b> Add <code>KV_REST_API_URL</code> and <code>KV_REST_API_TOKEN</code> '
      + 'env vars (Vercel KV / Upstash free tier) to keep stats permanently. Leads still reach Discord either way.</div>';
  }

  /* ---- the old tracking, kept, collapsed ---- */
  var L = d.legacy;
  if (L && L.totals && L.totals.views){
    var open = false;
    try{ open = sessionStorage.getItem('zl_old_open') === '1'; }catch(_){}
    html += '<details class="old" id="old"' + (open ? ' open' : '') + '><summary>Before new tracking'
      + '<small>' + L.totals.views + ' visits' + (L.from ? ', ' + day(L.from) + ' to ' + day(L.to) : '')
      + '. Not filtered: includes bots, previews and our own early tests.</small></summary><div class="inner">'
      + legacy(L, d.admin)
      + '</div></details>';
  }

  document.getElementById('app').innerHTML = html;
}

function steps(list, views){
  list = list || [];
  var worst = list.slice().sort(function(a,b){ return b.droppedHere - a.droppedHere; })[0];
  var html = '<h2>Step breakdown</h2>'
    + '<div class="legend"><span class="r">Reached this step</span><span class="d">Dropped off here</span></div>'
    + '<div class="panel">'
    + list.map(function(s){
        var rp = views ? (s.reached / views) * 100 : 0;
        var dp = views ? (s.droppedHere / views) * 100 : 0;
        return '<div class="row"><div class="top"><b>' + esc(s.label) + '</b>'
          + '<span>' + s.reached + ' reached · <span class="drop">' + s.droppedHere + ' left</span></span></div>'
          + '<div class="bar"><i style="width:' + rp.toFixed(1) + '%"></i><u style="width:' + dp.toFixed(1) + '%"></u></div></div>';
      }).join('')
    + '</div>';
  if (worst && worst.droppedHere > 0){
    html += '<p class="note">Biggest leak: <b>' + esc(worst.label) + '</b> — ' + worst.droppedHere + ' people stopped there.</p>';
  }
  return html;
}

/* One row per value that actually turned up, so a new ad, platform or
   placement appears here by itself. */
function breakdown(title, rows, emptyName){
  rows = rows || [];
  var html = '<h2>' + title + '</h2>';
  if (!rows.length) return html + '<div class="panel">Nothing yet in this window.</div>';
  var top = Math.max.apply(null, rows.map(function(r){ return r.views || 0; })) || 0;
  return html + '<div class="vlist">'
    + rows.map(function(r){
        var none = r.key === '(none)';
        var w = top ? (r.views / top) * 100 : 0;
        return '<div class="v">'
          + '<div class="v-name' + (none ? ' none' : '') + '">' + (none ? emptyName : esc(r.key)) + '</div>'
          + '<div class="v-conv">' + r.conversionRate + '%</div>'
          + '<div class="bar"><i style="width:' + w.toFixed(1) + '%"></i></div>'
          + '<div class="v-stats six">'
            + stat(r.views, mode === 'verified' ? 'people' : 'visits')
            + stat(r.engaged, 'engaged')
            + stat(r.started, 'answered')
            + stat(r.leads, 'leads')
            + stat(dur(r.visibleMedianMs), 'median time')
            + stat(dur(r.firstAnswerMedianMs), 'to Q1')
          + '</div>'
        + '</div>';
      }).join('')
    + '</div>';
}

function leadsBlock(leads, admin, isV2){
  var html = '<h2>' + (isV2 ? 'Leads' : 'Leads (old tracking)') + (admin && leads ? ' (' + leads.length + ')' : '') + '</h2>';
  if (!admin){
    return html + '<div class="panel locked"><span>Names, emails and phone numbers are hidden on the public report.</span>'
      + '<button type="button" data-unlock="1">Show lead details</button></div>';
  }
  if (!leads || !leads.length) return html + '<div class="panel">No leads yet in this window.</div>';
  return html + '<div class="tbl-scroll"><table><tr><th>When (Toronto)</th>' + (isV2 ? '<th>Counted</th><th>Ad</th>' : '')
    + '<th>Name</th><th>Email</th><th>Phone</th></tr>'
    + leads.map(function(l){
        return '<tr><td>' + esc(when(l.ts)) + '</td>'
          + (isV2 ? '<td><span class="tag ' + (l.verified ? 'ok">real click' : 'no">not verified') + '</span></td><td>' + esc(l.a || '—') + '</td>' : '')
          + '<td>' + esc(l.name) + '</td><td>' + esc(l.email) + '</td><td>' + esc(l.phone) + '</td></tr>';
      }).join('')
    + '</table></div>';
}

function legacy(L, admin){
  var t = L.totals, views = t.views || 0;
  var html = '<div class="cards">'
    + card(views, 'Total views')
    + card(t.attempted, 'Attempted &amp; left')
    + card(t.bounced, 'Left immediately')
    + card(t.leads, 'Leads submitted', true)
    + card(t.conversionRate + '%', 'Conversion rate', true)
    + card(dur(t.avgLandingMs), 'Avg time on Q1')
    + card(dur(t.avgSessionMs), 'Avg time on page')
    + '</div>';
  html += steps(L.steps, views);
  var vs = L.variants || [];
  html += '<h2>Traffic by ad variant</h2>';
  if (!vs.length) html += '<div class="panel">Nothing in this window.</div>';
  else {
    var top = vs[0].views || 0;
    html += '<div class="vlist">' + vs.map(function(v){
      var w = top ? (v.views / top) * 100 : 0;
      return '<div class="v"><div class="v-name' + (v.variant === '(none)' ? ' none' : '') + '">'
        + (v.variant === '(none)' ? 'direct' : esc(v.variant)) + '</div>'
        + '<div class="v-conv">' + v.conversionRate + '%</div>'
        + '<div class="bar"><i style="width:' + w.toFixed(1) + '%"></i></div>'
        + '<div class="v-stats">' + stat(v.views, 'views') + stat(v.started, 'started') + stat(v.leads, 'leads')
        + stat(dur(v.avgLandingMs), 'on Q1') + stat(dur(v.avgSessionMs), 'total') + '</div></div>';
    }).join('') + '</div>';
  }
  if (admin) html += leadsBlock(L.leads, true, false);
  return html;
}

/* 0 reads as "no data", not "instant" — show a dash instead. */
function dur(ms){
  if (!ms) return '—';
  var s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60);
  return m + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '');
}
var TZ = {timeZone:'America/Toronto'};
function when(ts){ try{ return new Date(ts).toLocaleString('en-CA', Object.assign({dateStyle:'medium', timeStyle:'short'}, TZ)); }catch(_){ return new Date(ts).toLocaleString(); } }
function day(ts){ try{ return new Date(ts).toLocaleDateString('en-CA', Object.assign({month:'short', day:'numeric'}, TZ)); }catch(_){ return ''; } }

function stat(n, l){
  return '<div><b>' + (n == null ? 0 : n) + '</b><span>' + l + '</span></div>';
}

function card(n, l, amber){
  return '<div class="card"><span class="n' + (amber ? ' amber' : '') + '">' + (n == null ? 0 : n) + '</span><span class="l">' + l + '</span></div>';
}

function load(){
  var url = '/api/stats?days=' + days + (KEY ? '&key=' + encodeURIComponent(KEY) : '');
  fetch(url, {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      /* a key that no longer works is forgotten, not retried forever */
      if (KEY && !d.admin){ KEY = ''; try{ localStorage.removeItem('zl_admin_key'); }catch(_){} }
      render(d);
    })
    .catch(function(){ document.getElementById('app').innerHTML = '<div class="panel">Could not load stats. Is /api/stats deployed?</div>'; });
}

document.getElementById('app').addEventListener('click', function(e){
  var seg = e.target.closest('#seg button');
  if (seg){ mode = seg.getAttribute('data-mode'); if (last) render(last); return; }
  if (e.target.closest('[data-unlock]')){
    var k = prompt('Admin key (ADMIN_KEY in Vercel):');
    if (!k) return;
    KEY = k; try{ localStorage.setItem('zl_admin_key', k); }catch(_){}
    load();
  }
});
document.getElementById('app').addEventListener('toggle', function(e){
  if (e.target.id === 'old') try{ sessionStorage.setItem('zl_old_open', e.target.open ? '1' : '0'); }catch(_){}
}, true);

/* Deletes everything, so it asks twice: once for the key, once to be
   sure. There is no undo. */
document.getElementById('wipe').addEventListener('click', function(){
  var key = prompt('Admin key (set as ADMIN_KEY in Vercel):');
  if (!key) return;
  if (!confirm('Delete every stored event? This cannot be undone.')) return;
  fetch('/api/reset', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ key: key })
  })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.ok) { alert('Deleted ' + d.deleted + ' events. Report is now empty.'); load(); }
      else alert('Not wiped: ' + (d.error || 'unknown error'));
    })
    .catch(function(){ alert('Could not reach /api/reset. Is it deployed?'); });
});

document.getElementById('filters').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b || b.id === 'wipe') return;
  days = Number(b.getAttribute('data-days'));
  [].forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('is-on', x === b); });
  load();
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
