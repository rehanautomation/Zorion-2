<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zorion Life — Funnel report</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#10243A; --slate:#52657A; --slate-light:#8698A9;
  --sky:#F4F8FB; --white:#fff; --line:#D6E3EE; --blue:#1D6FB8; --amber:#D9822B;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--slate);font-family:Inter,sans-serif;font-size:15px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header .brand{font-family:Archivo,sans-serif;font-weight:700;letter-spacing:.08em;font-size:15px}
.filters{display:flex;gap:8px}
.filters button{
  border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;
  font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer;
}
.filters button.is-on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 64px}
h2{font-family:Archivo,sans-serif;font-size:15px;color:var(--navy);margin:32px 0 12px;letter-spacing:.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card .n{display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:34px;line-height:1;color:var(--navy)}
.card .n.amber{color:var(--amber)}
.card .l{display:block;margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--slate-light)}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.row{margin-bottom:14px}
.row:last-child{margin-bottom:0}
.row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.row .top b{color:var(--navy);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar u{position:absolute;top:0;left:0;height:100%;background:var(--amber);opacity:.9;border-radius:99px}
.drop{font-size:12px;color:var(--amber);font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-light);background:var(--sky)}
tr:last-child td{border-bottom:0}
.note{font-size:12px;color:var(--slate-light);margin-top:10px}
.warn{background:#FDF4EA;border:1px solid #F0D9BE;color:#8A5A1E;padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--slate-light);margin-bottom:14px}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.legend .r::before{background:var(--blue)}
.legend .d::before{background:var(--amber)}

/* ---- traffic by ad variant ----
   Cards on a phone, one table row per variant on a wide screen. The
   same markup either way: the row items are grid cells below 700px and
   table cells above it. */
.vlist{display:grid;gap:10px}
.v{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 10px;
}
.v-name{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;color:var(--navy);word-break:break-word}
.v-name.none{font-weight:600;color:var(--slate-light)}
.v-conv{font-family:Archivo,sans-serif;font-weight:700;font-size:17px;color:var(--blue);white-space:nowrap;text-align:right}
.v .bar{grid-column:1/-1;margin-top:10px}
.v-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:12px}
.v-stats b{display:block;font-family:Archivo,sans-serif;font-weight:700;font-size:16px;color:var(--navy);line-height:1.1}
.v-stats span{display:block;margin-top:3px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--slate-light)}

@media (min-width:700px){
  .vlist{display:table;width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;gap:0}
  .v{display:table-row;border:0;border-radius:0;padding:0}
  /* every direct child becomes a cell — including .v-stats, so its
     display must not be re-declared below */
  .v>*{display:table-cell;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  .v:last-child>*{border-bottom:0}
  .v-name{width:30%}
  .v-conv{width:76px;text-align:left}
  .v .bar{display:none}
  .v-stats{margin-top:0;text-align:right}
  .v-stats>div{display:inline-block;min-width:58px;margin-left:24px;text-align:right;vertical-align:top}
}
</style>
</head>
<body>
<header>
  <span class="brand">ZORION LIFE · FUNNEL REPORT</span>
  <div class="filters" id="filters">
    <button data-days="1">24h</button>
    <button data-days="7">7d</button>
    <button data-days="30">30d</button>
    <button data-days="0" class="is-on">All</button>
    <button id="wipe" title="Delete every stored event" style="margin-left:14px;border-color:#5A2A2A;color:#D98A8A">Wipe data</button>
  </div>
</header>

<div class="wrap" id="app">Loading…</div>

<script>
var days = 0;

function esc(s){ return String(s == null ? '' : s).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }); }

function render(d){
  var t = d.totals, views = t.views || 0;
  var worst = d.steps.slice().sort(function(a,b){ return b.droppedHere - a.droppedHere; })[0];

  var html = '';
  html += '<h2>Overview</h2><div class="cards">'
    + card(views, 'Total views')
    + card(t.attempted, 'Attempted &amp; left')
    + card(t.bounced, 'Left immediately')
    + card(t.leads, 'Leads submitted', true)
    + card(t.conversionRate + '%', 'Conversion rate', true)
    + card(dur(t.avgLandingMs), 'Avg time on Q1')
    + card(dur(t.avgSessionMs), 'Avg time on page')
    + '</div>';

  html += '<h2>Step breakdown</h2>'
    + '<div class="legend"><span class="r">Reached this step</span><span class="d">Dropped off here</span></div>'
    + '<div class="panel">'
    + d.steps.map(function(s){
        var rp = views ? (s.reached / views) * 100 : 0;
        var dp = views ? (s.droppedHere / views) * 100 : 0;
        return '<div class="row"><div class="top"><b>' + esc(s.label) + '</b>'
          + '<span>' + s.reached + ' reached · <span class="drop">' + s.droppedHere + ' left</span></span></div>'
          + '<div class="bar"><i style="width:' + rp.toFixed(1) + '%"></i><u style="width:' + dp.toFixed(1) + '%"></u></div></div>';
      }).join('')
    + '</div>';

  if (worst && worst.droppedHere > 0){
    html += '<p class="note">Biggest leak: <b>' + esc(worst.label) + '</b> — ' + worst.droppedHere + ' people stopped there.</p>';
  }

  /* Built from whatever ?a= values turned up in the data, so a new ad
     variant appears here by itself. */
  var vs = d.variants || [];
  html += '<h2>Traffic by ad variant</h2>';
  if (!vs.length){
    html += '<div class="panel">Nothing yet in this window.</div>';
  } else {
    var topViews = vs[0].views || 0;
    html += '<div class="vlist">'
      + vs.map(function(v){
          var w = topViews ? (v.views / topViews) * 100 : 0;
          return '<div class="v">'
            + '<div class="v-name' + (v.variant === '(none)' ? ' none' : '') + '">'
              + (v.variant === '(none)' ? 'direct' : esc(v.variant)) + '</div>'
            + '<div class="v-conv">' + v.conversionRate + '%</div>'
            + '<div class="bar"><i style="width:' + w.toFixed(1) + '%"></i></div>'
            + '<div class="v-stats">'
              + stat(v.views, 'views')
              + stat(v.started, 'started')
              + stat(v.leads, 'leads')
              + stat(dur(v.avgLandingMs), 'on Q1')
              + stat(dur(v.avgSessionMs), 'total')
            + '</div>'
          + '</div>';
        }).join('')
      + '</div>';
  }

  html += '<h2>Recent leads (' + d.leads.length + ')</h2>';
  if (!d.leads.length){
    html += '<div class="panel">No leads yet in this window.</div>';
  } else {
    html += '<table><tr><th>When</th><th>Name</th><th>Email</th><th>Phone</th></tr>'
      + d.leads.map(function(l){
          return '<tr><td>' + new Date(l.ts).toLocaleString() + '</td><td>' + esc(l.name)
            + '</td><td>' + esc(l.email) + '</td><td>' + esc(l.phone) + '</td></tr>';
        }).join('')
      + '</table>';
  }

  if (!d.persistent){
    html += '<div class="warn"><b>Storage is temporary.</b> Add <code>KV_REST_API_URL</code> and <code>KV_REST_API_TOKEN</code> '
      + 'env vars (Vercel KV / Upstash free tier) to keep stats permanently. Leads still reach Discord either way.</div>';
  }

  document.getElementById('app').innerHTML = html;
}

/* 0 reads as "no data", not "instant" — show a dash instead. */
function dur(ms){
  if (!ms) return '—';
  var s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60);
  return m + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '');
}

function stat(n, l){
  return '<div><b>' + n + '</b><span>' + l + '</span></div>';
}

function card(n, l, amber){
  return '<div class="card"><span class="n' + (amber ? ' amber' : '') + '">' + n + '</span><span class="l">' + l + '</span></div>';
}

function load(){
  fetch('/api/stats?days=' + days, {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(){ document.getElementById('app').innerHTML = '<div class="panel">Could not load stats. Is /api/stats deployed?</div>'; });
}

/* Deletes everything, so it asks twice: once for the key, once to be
   sure. There is no undo. */
document.getElementById('wipe').addEventListener('click', function(){
  var key = prompt('Admin key (set as ADMIN_KEY in Vercel):');
  if (!key) return;
  if (!confirm('Delete every stored event? This cannot be undone.')) return;
  fetch('/api/reset', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ key: key })
  })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.ok) { alert('Deleted ' + d.deleted + ' events. Report is now empty.'); load(); }
      else alert('Not wiped: ' + (d.error || 'unknown error'));
    })
    .catch(function(){ alert('Could not reach /api/reset. Is it deployed?'); });
});

document.getElementById('filters').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (!b || b.id === 'wipe') return;
  days = Number(b.getAttribute('data-days'));
  [].forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('is-on', x === b); });
  load();
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
