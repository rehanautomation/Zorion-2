# Sends the CRM's Discord call reminders. Vercel's free plan only runs
# a cron once a day, so GitHub runs this every 5 minutes instead.
name: CRM reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 40 https://www.zorionlife.com/api/remind
