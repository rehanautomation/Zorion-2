<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Videos</title>
<style>
body{margin:0;background:#111;color:#fff;font:16px system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:4px 0 16px}
.c{background:#1c1c1c;border-radius:12px;padding:14px;margin-bottom:14px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px}
b{font-size:17px}small{color:#999}
button{font:600 15px system-ui;padding:12px 18px;border:0;border-radius:8px;background:#fff;color:#000;min-width:130px}
button:disabled{opacity:.6}
.bar{height:6px;background:#333;border-radius:3px;margin-top:12px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:#4ade80;transition:width .15s}
.p{font-size:13px;color:#aaa;margin-top:6px;min-height:16px}
.p a{color:#4ade80}
</style></head><body>
<h1>Final videos</h1>
<div id="list"></div>
<script>
const vids=[["V1_final.mp4","Video 1","31 MB"],["V2_final.mp4","Video 2","23 MB"],["V3_final.mp4","Video 3","45 MB"],["V4_final.mp4","Video 4","27 MB"]];
const list=document.getElementById('list');
vids.forEach(([f,t,sz])=>{
  const c=document.createElement('div');c.className='c';
  c.innerHTML=`<div class="r"><div><b>${t}</b><br><small>${sz}</small></div><button>Download</button></div><div class="bar"><i></i></div><div class="p"></div>`;
  list.appendChild(c);
  const btn=c.querySelector('button'),bar=c.querySelector('.bar'),fill=c.querySelector('i'),p=c.querySelector('.p');
  btn.onclick=async()=>{
    btn.disabled=true;btn.textContent='Downloading…';bar.style.display='block';fill.style.width='0';
    try{
      const r=await fetch('/assets/video/'+f);if(!r.ok)throw 0;
      const total=+r.headers.get('content-length')||0;
      const rd=r.body.getReader();const parts=[];let got=0;
      for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;
        const pc=total?Math.round(got/total*100):0;fill.style.width=pc+'%';
        p.textContent=(got/1048576).toFixed(1)+' MB'+(total?' / '+(total/1048576).toFixed(1)+' MB · '+pc+'%':'');}
      const u=URL.createObjectURL(new Blob(parts,{type:'video/mp4'}));
      const a=document.createElement('a');a.href=u;a.download=f;document.body.appendChild(a);a.click();a.remove();
      fill.style.width='100%';btn.textContent='Saved ✓';
      p.innerHTML='Done. Nothing saved? <a href="'+u+'" download="'+f+'">Tap here</a>.';
      setTimeout(()=>{btn.disabled=false;btn.textContent='Download again'},1500);
    }catch(e){
      p.innerHTML='Download failed. <a href="/assets/video/'+f+'" download>Open the file directly</a>.';
      btn.disabled=false;btn.textContent='Retry';
    }
  };
});
</script>
</body></html>
