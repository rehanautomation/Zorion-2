<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Videos</title>
<link rel="preload" as="image" href="/assets/video/v1.jpg">
<link rel="preload" as="video" href="/assets/video/v1.mp4?v=2" type="video/mp4">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.s{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
.tag{position:absolute;top:14px;left:14px;color:#fff;font:600 14px system-ui;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:20px}
#go{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#go button{font:700 20px system-ui;padding:16px 32px;border-radius:40px;border:0;background:#fff;color:#000}
</style></head><body>
<div id="go"><button>Start scrolling ▶</button></div>
<div id="feed"></div>
<script>
const vids=[["v1","Video 1"],["v2","Video 2"],["v3","Video 3"],["v4","Video 4"]];
const feed=document.getElementById('feed');
[...vids,vids[0]].forEach(([f,t],i)=>{
  const s=document.createElement('div');s.className='s';
  s.innerHTML=`<video src="/assets/video/${f}.mp4?v=2" poster="/assets/video/${f}.jpg" playsinline loop muted preload="${i==0?'auto':'metadata'}"></video><div class="tag">${t}</div>`;
  feed.appendChild(s);
});
const els=[...feed.querySelectorAll('video')];
let sound=false;
const io=new IntersectionObserver(es=>es.forEach(e=>{
  const v=e.target;
  if(e.isIntersecting){v.muted=!sound;v.play().catch(()=>{v.muted=true;v.play()});}
  else{v.pause();v.currentTime=0;}
}),{threshold:.6});
els.forEach(v=>io.observe(v));
// infinite loop: clone of video 1 sits at the end; when we land on it, jump to the real first
let t;feed.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{
  if(Math.round(feed.scrollTop/feed.clientHeight)>=vids.length) feed.scrollTo({top:0,behavior:'instant'});
},120)});
els.forEach(v=>v.addEventListener('click',()=>{v.paused?v.play():v.pause()}));
// download every video fully in the background (in order) and swap in the local copy -> instant playback
(async()=>{for(const [f] of vids){try{const b=await (await fetch(`/assets/video/${f}.mp4?v=2`)).blob();const u=URL.createObjectURL(b);
 els.forEach(v=>{if(v.src.includes(`/${f}.mp4`)&&v.paused){v.src=u;v.load();}else if(v.src.includes(`/${f}.mp4`)){v.dataset.blob=u;}});}catch(e){}}})();
els.forEach(v=>v.addEventListener('pause',()=>{if(v.dataset.blob){v.src=v.dataset.blob;delete v.dataset.blob;v.load();}}));
document.querySelector('#go button').onclick=()=>{sound=true;document.getElementById('go').remove();els[0].muted=false;els[0].currentTime=0;els[0].play();};
</script>
</body></html>
